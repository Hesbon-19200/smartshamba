        stroke: #ffffff;
        stroke-width: 1.6;
      }
      .brand-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 38px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
    </style>
  </defs>

